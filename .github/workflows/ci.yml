name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify shared code synchronization (zero drift)
        run: pnpm run sync:shared:check

      - name: Verify code formatting
        run: pnpm run format:check

      - name: Lint codebase
        run: pnpm run lint

      - name: Type check (tsc --noEmit)
        run: pnpm run type-check

      - name: Run unit & component tests (vitest)
        run: pnpm run test

      - name: Build applications (next build)
        run: pnpm run build

      - name: Install Playwright Browsers
        run: pnpm --filter @starterkit/dashboard exec playwright install --with-deps chromium

      - name: Run Dashboard E2E tests
        run: pnpm --filter @starterkit/dashboard run test:e2e

      - name: Run Website E2E tests
        run: pnpm --filter @starterkit/website run test:e2e

      - name: Upload Playwright Reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            typescript/nextjs/starterkit/dashboard/playwright-report/
            typescript/nextjs/starterkit/website/playwright-report/
          retention-days: 7
